packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  # sharp needs its native libvips binding; unrs-resolver needs its native
  # resolver binary. Both are already declared in onlyBuiltDependencies
  # below but pnpm 11's build-script gate requires this separate explicit
  # per-package approval too (pnpm approve-builds run non-interactively —
  # e.g. in CI with --frozen-lockfile — just fails with
  # ERR_PNPM_IGNORED_BUILDS instead of prompting, so this has to be
  # committed rather than approved ad hoc on a dev machine).
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@firebase/util'
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver

# Vercel builds and runs on linux-x64 while dev machines are darwin-arm64.
# Without both architectures in the lockfile's optional-dependency set,
# sharp's @img/sharp-libvips-linux-x64 binaries are absent from the deployed
# bundle and sharp fails to load at runtime (ERR_DLOPEN_FAILED, libvips).
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
