name: CI

# PRD §8.8: typecheck, lint (ESLint + Prettier), unit, integration (service
# containers + the Firebase Storage emulator), build, Playwright + axe.
# Merges to main are blocked on all six jobs below going green — branch
# protection requires each job name as
# a status check, in strict mode (the branch must be up to date with main
# before a check counts). That's configured out-of-band via `gh api`, not
# expressible in this file; see
# https://github.com/its-me-anoop/doorstep/settings/branches.
#
# No required PR review count is set. This is a solo-dev repo right now —
# a mandatory reviewer would just mean self-approving every PR, which is
# ceremony without a safety benefit. The six status checks are the actual
# safety net; add a review requirement back the day a second person can
# review.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# A new push to the same PR/branch supersedes the in-flight run instead of
# queuing behind it — avoids paying for CI on commits nobody will look at.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default token scope for every job: read-only. Nothing here deploys or
# writes back to the repo, so there is no reason to widen this per-job.
permissions:
  contents: read

env:
  # Shared by the build job and (implicitly, baked into playwright.config.ts)
  # the e2e job's spawned server. Shaped like .env.example — none of these
  # need to resolve to a real Firebase project or database because every
  # adapter that reads them (drizzle client, Firebase Admin app, Firebase
  # client SDK) constructs lazily; see the doc comments on
  # src/adapters/drizzle/client.ts and src/adapters/firebase/admin-app.ts.
  PLACEHOLDER_DATABASE_URL: postgres://user:password@localhost:5432/doorstep
  PLACEHOLDER_FIREBASE_API_KEY: test-api-key
  PLACEHOLDER_FIREBASE_AUTH_DOMAIN: doorstep-test.firebaseapp.com
  PLACEHOLDER_FIREBASE_PROJECT_ID: doorstep-test
  PLACEHOLDER_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
  PLACEHOLDER_FIREBASE_CLIENT_EMAIL: firebase-adminsdk-test@doorstep-test.iam.gserviceaccount.com

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint
      # prettier is a devDependency of apps/web only, so pnpm never hoists
      # its bin to the workspace root — `pnpm exec prettier` from the root
      # would resolve prettier-plugin-tailwindcss against the wrong
      # node_modules tree and fail. Invoking apps/web's own binary with
      # cwd=apps/web sidesteps that. --ignore-path points back at the
      # repo's single .prettierignore (it deliberately excludes the
      # generated shadcn output in src/components/ui).
      - name: Prettier --check
        working-directory: apps/web
        run: ./node_modules/.bin/prettier --check --ignore-path ../../.prettierignore .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: doorstep
          POSTGRES_PASSWORD: doorstep
          POSTGRES_DB: doorstep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doorstep -d doorstep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # tests/integration/meilisearch-adapter.test.ts (PRD §8.6, M2) now
      # exercises MeilisearchSearchIndex for real against this container —
      # gated on TEST_MEILISEARCH_HOST below, same skip-when-absent shape
      # as TEST_DATABASE_URL for the Postgres suites. Still no healthcheck
      # gating the job on it coming up: that suite's own beforeAll
      # (ensureSettings/upsert) is itself the readiness check, the same
      # way the Postgres suites' own migrate() calls are for the postgres
      # service above.
      meilisearch:
        image: getmeili/meilisearch:v1.48
        env:
          MEILI_MASTER_KEY: ci-scaffold-master-key-not-a-secret
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      # The Firebase Storage emulator (next step) ships as a Java jar.
      # ubuntu-latest images bundle several JDKs already, but pinning one
      # explicitly here — rather than relying on whatever happens to be on
      # PATH by default — keeps this job's Java version an explicit,
      # intentional choice instead of an ambient runner-image detail.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run integration tests against the service containers + Storage emulator
        env:
          TEST_DATABASE_URL: postgres://doorstep:doorstep@localhost:5432/doorstep_test
          # tests/integration/image-storage-firebase-emulator.contract.test.ts
          # gates on this (via firebase-storage-adapter.ts's
          # resolveStorageEmulatorHost) and runs the REAL
          # FirebaseStorageAdapter's full contract suite against it — no
          # FIREBASE_PROJECT_ID/CLIENT_EMAIL/PRIVATE_KEY needed here: that
          # test file synthesises its own throwaway (but structurally
          # valid — firebase-admin's cert() parses the key regardless of
          # whether it's ever used to authenticate anything real) Admin
          # SDK credential when none is already configured, the same way
          # playwright.config.ts's THROWAWAY_PRIVATE_KEY does. This is the
          # M1 exit criterion — "contract tests green on the storage
          # adapter" — running against a real Storage API surface in CI
          # from now on, not just the always-on in-memory fake.
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          # tests/integration/meilisearch-adapter.test.ts (PRD §8.6)
          # against the meilisearch service container above — same
          # not-a-secret master key that container is started with.
          TEST_MEILISEARCH_HOST: http://localhost:7700
          TEST_MEILISEARCH_API_KEY: ci-scaffold-master-key-not-a-secret
        # firebase.json/storage.rules live at the repo root (this job's
        # cwd — see firebase-storage-adapter.ts's header comment for why
        # there rather than apps/web/), so this runs from the root, using
        # the root package.json's proxied test:integration script rather
        # than apps/web's own (equivalent; keeps this step's cwd matching
        # firebase.json's location instead of adding a --config flag).
        # `emulators:exec` starts the emulator, waits for it to be ready,
        # runs the wrapped command, and tears the emulator down again
        # afterwards either way — including when the command fails — so
        # this can't leak a background emulator process into later steps.
        # "demo-doorstep" (the `demo-` prefix is a firebase-tools
        # convention for "never a real project") keeps this fully local.
        # Wraps the whole test:integration run, not a Storage-only subset:
        # the Postgres-backed suites don't care that the emulator is also
        # up, and one integration-test command is simpler than two.
        # Applies the real migrations in src/adapters/drizzle/migrations
        # (including 0000's CREATE EXTENSION postgis/citext) against the
        # container, then asserts the schema — tests/integration/db.schema.test.ts
        # skips with this same command locally where TEST_DATABASE_URL is unset.
        run: npx --yes firebase-tools@15.9.0 emulators:exec --only storage --project demo-doorstep "pnpm test:integration"
      - name: Apply migrations for the seed step
        working-directory: apps/web
        env:
          DATABASE_URL: postgres://doorstep:doorstep@localhost:5432/doorstep_test
        # Belt and braces: the integration tests above already migrate this
        # same database, and drizzle-kit migrate tracks applied migrations
        # so re-running is a no-op — but the seed step shouldn't silently
        # depend on a side effect of an unrelated test file to have schema
        # to insert into.
        run: pnpm db:migrate
      - name: Run the seed script against the postgis service container
        working-directory: apps/web
        env:
          DATABASE_URL: postgres://doorstep:doorstep@localhost:5432/doorstep_test
        # There is no local DB on the dev machine this was built on (see
        # scripts/seed.ts's doc comment), so this is the only place the
        # script — and its idempotent delete-then-insert, which is where
        # the FK-cycle-breaking logic actually matters — is ever exercised
        # for real. Runs twice to prove the idempotency claim: a second
        # run against rows the first run just inserted must succeed and
        # still leave exactly 20 properties, not fail or duplicate rows.
        run: |
          pnpm seed
          pnpm seed
      - name: Assert the seed produced exactly 20 properties
        working-directory: apps/web
        env:
          DATABASE_URL: postgres://doorstep:doorstep@localhost:5432/doorstep_test
        run: pnpm seed:assert

  build:
    needs: [typecheck, lint, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - name: next build with placeholder public env vars
        env:
          DATABASE_URL: ${{ env.PLACEHOLDER_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ env.PLACEHOLDER_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ env.PLACEHOLDER_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ env.PLACEHOLDER_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ env.PLACEHOLDER_FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ env.PLACEHOLDER_FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ env.PLACEHOLDER_FIREBASE_CLIENT_EMAIL }}
          # Literal \n escapes, not real newlines — matches the contract
          # documented in .env.example and unescaped by
          # src/adapters/firebase/admin-app.ts's readPrivateKey(). Not a
          # real key; nothing in the build or e2e suite performs a real
          # Admin SDK credential check.
          FIREBASE_PRIVATE_KEY: '-----BEGIN PRIVATE KEY-----\nMIIBVgIBADANBgkqhkiG9w0BAQEFAASCAT8wggE7AgEAAkEA0Z\n-----END PRIVATE KEY-----\n'
        run: pnpm build
      # PRD §7.1 / §13's M3 exit criterion, structurally encoded rather
      # than eyeballed off a bundle-size diff: reads this same build's
      # own .next output (no second build) and fails if any list-tier
      # route's client bundle references the MapLibre/Mapbox GL chunk —
      # see scripts/assert-map-bundle-isolation.ts's own doc comment.
      - name: Assert the map bundle stays isolated from the list routes
        run: pnpm assert:map-bundle-isolation
      # Guards the production worker-URL fix (maplibre-adapter.ts's own
      # doc comment): the vendored public/vendor/maplibre-gl/ worker
      # files must stay byte-identical to whatever maplibre-gl version is
      # actually installed, or production silently gets a stale/
      # mismatched worker script again.
      - name: Assert the vendored MapLibre worker files are up to date
        run: pnpm assert:maplibre-worker-vendored

  e2e:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-pnpm
      - name: Install Chromium (+ OS deps)
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run smoke + axe suite
        working-directory: apps/web
        # BASE_URL is intentionally unset: playwright.config.ts's webServer
        # then builds and starts the app itself against its own baked-in
        # placeholder env block (see the config's doc comment) — no secrets
        # needed. This means the app gets built twice across the `build`
        # and `e2e` jobs; that duplication is deliberate for now (keeps this
        # job self-contained and matches how a real preview-deploy URL will
        # slot into BASE_URL later) but is a candidate to collapse via a
        # shared build artifact once that's worth the added complexity.
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
